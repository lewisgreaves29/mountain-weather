apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mountain-weather-ingress
  namespace: apps
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - secretName: mountain-weather-tls-cert
      hosts:
        - mountains.greaveslabs.io
        - mountain-weather.greaveslabs.io
  rules:
    - host: mountains.greaveslabs.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mountain-weather
                port:
                  number: 8000
    - host: mountain-weather.greaveslabs.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mountain-weather
                port:
                  number: 8000
